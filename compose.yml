services:
    app:
        image: ghcr.io/marvenx/sdelab/app:v1.0.0
        container_name: github-action-app
        ports:
        - "5000:5000"
        networks:
        - github-action-network
        secrets:
            - my_secret
        volumes:
            - ./json/data.json:/app/json/data.json:rw

networks:
    github-action-network:
        driver: bridge

secrets:
    my_secret:
        file: .env
